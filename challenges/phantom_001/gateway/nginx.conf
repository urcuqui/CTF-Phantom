# Reverse proxy that bridges the host (agent) to the challenge container, which lives on an
# internal-only Docker network with no route to the internet.
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;

    location / {
        proxy_pass http://challenge:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect off;
        proxy_read_timeout 15s;
    }
}
