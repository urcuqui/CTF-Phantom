# Fast checks on every push / PR. No external LLM APIs, no Docker.
# Real-provider experiments are refused by the harness when CI is set (CTF_PHANTOM_ALLOW_PAID_RUNS
# is intentionally never defined here).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  # Ephemeral per-workflow flag secret; tests also set their own fixed test secret.
  CTF_PHANTOM_FLAG_SECRET: ci-ephemeral-${{ github.run_id }}-${{ github.run_attempt }}-0123456789abcdef

jobs:
  lint:
    name: Ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[all,dev]"
      - run: ruff check src tests
      - run: mypy

  unit:
    name: Unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[all,dev]"
      - run: pytest tests/unit -q --ignore=tests/unit/test_variant_consistency.py

  variant-consistency:
    name: Challenge variant consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[all,dev]"
      - run: pytest tests/unit/test_variant_consistency.py tests/unit/test_challenge_loading.py -q
      - name: Reference solution solves every variant (local backend)
        run: ctf-phantom validate --backend local --output-dir "$RUNNER_TEMP/validate"

  integration:
    name: Integration tests (scripted agents, local backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[all,dev]"
      - run: pytest tests/integration -q -m "not docker"
      - name: Smoke experiment + summary
        run: |
          ctf-phantom run --config experiments/phantom_001_scripted_smoke.yaml --output-dir "$RUNNER_TEMP/smoke"
          ctf-phantom summarize "$RUNNER_TEMP/smoke/phantom_001_scripted_smoke"
      - name: Pilot config preflight (dry run, no API calls)
        run: ctf-phantom run --config experiments/pilot/phantom_001_pilot.yaml --backend local --dry-run --provider scripted --model reference

  evaluator-regression:
    name: Evaluator regression (golden + legacy traces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[all,dev]"
      - run: pytest tests/regression -q
