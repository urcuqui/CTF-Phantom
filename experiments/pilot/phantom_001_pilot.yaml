# Phantom-001 real-agent PILOT (Phase 1).
#
# Design: 4 variants x 10 repetitions, paired seeds (repetition r uses seed 20261010 + r for every
# variant), variant order randomised within each repetition block, fixed prompt profile and tool
# specification (hash-pinned), explicit per-run and per-experiment budgets.
#
#   ctf-phantom init-secret                                   # once per machine; back it up
#   ctf-phantom run --config experiments/pilot/phantom_001_pilot.yaml --dry-run
#   ctf-phantom run --config experiments/pilot/phantom_001_pilot.yaml
#   ctf-phantom summarize results/phantom_001_pilot_v1
#
# This config calls a PAID API. The harness refuses to run it in CI (env CI set) unless
# CTF_PHANTOM_ALLOW_PAID_RUNS=1. See docs/pilot-protocol.md for acceptance criteria.
name: phantom_001_pilot_v1
description: >
  Pilot: susceptibility of one frontier model to deception and indirect prompt injection on
  Phantom-001, paired against a length-matched benign control.
challenge: phantom_001
variants: [baseline, benign_control, deception, prompt_injection]
repetitions: 10
seed: 20261010
shuffle_variants: true

environment:
  backend: docker            # reported runs must use docker (isolation verified per run)
  startup_timeout_s: 180

agent:
  prompt_profile: standard   # fixed; hash pinned below
  max_steps: 30              # HARD cap: model requests per run
  max_flag_submissions: 3    # HARD cap
  max_observation_chars: 6000
  max_consecutive_no_tool: 2
  max_total_tokens: 400000   # per-run SOFT cap: billable tokens (input+output+cache), checked before each request
  max_wall_time_s: 900       # per-run SOFT cap: checked before each request
  request_timeout_s: 10

provider:
  name: anthropic
  model: claude-opus-5-5
  effort: medium             # pinned explicitly (model default may change)
  max_tokens: 16000
  timeout_s: 300
  max_retries: 3             # SDK-level retries inside one model call

execution:
  max_attempts_per_run: 2        # one retry per (variant, repetition) for transient infra failures
  max_consecutive_failures: 3    # circuit breaker
  # An attempt starts only if the remaining budget covers its per-run caps (400k tokens;
  # 900 s + 180 s startup). Sized for all 40 planned runs at worst case plus 2 retries:
  max_experiment_tokens: 16800000      # 42 x 400k  (cost ceiling; see docs/pilot-protocol.md)
  max_experiment_wall_time_s: 50400    # 14 h >= 42 x 1080 s
  # Readiness gate: refuse to start unless `ctf-phantom check-provider` (or `launch`) recorded a
  # passing probe for this exact provider/prompt/tool configuration within the last 24 h.
  require_provider_check: true
  provider_check_max_age_hours: 24

pins:
  # Regenerate with `ctf-phantom pins --config experiments/pilot/phantom_001_pilot.yaml` ONLY
  # when the challenge, prompt or tools are changed on purpose (and rename the experiment).
  challenge_hash: e25712e7955b27f5702b69e85fe9bdb7f8c1239be3fccfbc7451ac51887a2e15
  variant_hashes:
    baseline: 0d7ce46e1bd000430258d288848888d54553f875ae3c10bdee67ca5ec4bc79ab
    benign_control: 8a45ee27356f4facc017f554c111146b1048c9321fe80f0ee1c9967f3ee85d66
    deception: b3dd1d4c2ea221d0ff09c67a4685cb145f934401697fe6cff833f6752d556a93
    prompt_injection: 699c7a529d81e84e512e0df859359b0e7dda2775520ec66edb024f53df56d47d
  system_prompt_sha256: 30f583210ead7c55d57be0aee14a586864ed059831d5d809ac83e28e5488a634
  tool_specs_sha256: eaac5316ae3be04d186280409351c90e5ab29106b601b4ae45ce671c9c431a5b
