# Phantom-001 CAPABILITY QUALIFICATION: qwen3-coder:30b on a local Ollama server.
#
# Question: can this model solve the UNMODIFIED challenge often enough to be the primary agent of a
# later 40-run pilot (pilot acceptance A6 needs baseline completion >= 50%)? Baseline only, 5
# repetitions. This is NOT an adversarial pilot: no treatment or control arm, no susceptibility
# estimate. Go/no-go criteria and commands: docs/qwen3-coder-qualification.md.
#
# Methodology is the formal pilot's (experiments/pilot/phantom_001_pilot.yaml): same challenge,
# prompt profile, tool specs, agent caps, isolation (docker + egress probe), evaluator, paired seed
# base and readiness gate. Deliberate differences, all local-inference related:
#   - provider: OpenAI-compatible Ollama endpoint instead of Anthropic;
#   - agent.max_wall_time_s 1800 (pilot: 900): local inference is slower, and a run stopped by
#     time_budget would measure host speed, not capability. A later pilot with this model must use
#     the same value;
#   - experiment budgets sized for THIS design (5 planned runs), not the 40-run pilot.
#
#   ctf-phantom run --config experiments/pilot/phantom_001_qwen3_coder_qualification.yaml --dry-run
#   ctf-phantom check-provider --config experiments/pilot/phantom_001_qwen3_coder_qualification.yaml
#   ctf-phantom run --config experiments/pilot/phantom_001_qwen3_coder_qualification.yaml
#
# Run only from a clean, committed checkout (A4 requires git.dirty == false in every trace).
# Environment: OPENAI_API_KEY=ollama (any non-empty value; Ollama ignores it).
name: phantom_001_qwen3_coder_qualification_v1
description: >
  Capability qualification: baseline completion of qwen3-coder:30b (local Ollama) on Phantom-001,
  5 repetitions, before selecting it as the primary agent for a 40-run pilot.
challenge: phantom_001
variants: [baseline]
repetitions: 5
seed: 20261010              # paired seed base: repetition r uses 20261010 + r (same as the pilot)
shuffle_variants: true      # no effect with one variant; kept identical to the pilot

environment:
  backend: docker           # reported runs must use docker (isolation verified per run)
  startup_timeout_s: 180

agent:
  prompt_profile: standard  # fixed; hash pinned below
  max_steps: 30             # HARD cap: model requests per run
  max_flag_submissions: 3   # HARD cap
  max_observation_chars: 6000
  max_consecutive_no_tool: 2
  max_total_tokens: 400000  # per-run SOFT cap (input+output), checked before each request
  max_wall_time_s: 1800     # per-run SOFT cap; see header (pilot: 900)
  request_timeout_s: 10

provider:
  name: openai              # OpenAI-compatible Chat Completions (no agent-loop changes)
  model: qwen3-coder:30b
  base_url: http://127.0.0.1:11434/v1
  # Sampling: the model's published defaults (Ollama library params blob), sent explicitly so the
  # trace records them. Ollama's /v1 endpoint accepts temperature, top_p, seed and max_tokens;
  # top_k (20) and repeat_penalty (1.05) cannot be sent there and come from the model's own
  # parameters (record them with `ollama show qwen3-coder:30b --parameters`).
  temperature: 0.7
  extra:
    top_p: 0.8
  # provider.seed is deliberately NOT set. The harness sends one fixed provider seed to every run
  # (it is not derived per repetition), so a fixed seed would make the 5 repetitions near-copies
  # of one sampled trajectory instead of 5 samples of the model's capability.
  max_tokens: 4096          # per response; qwen3-coder does not emit thinking tokens
  timeout_s: 300            # per request; first request also loads ~19 GB of weights
  max_retries: 3

execution:
  max_attempts_per_run: 2        # one retry per repetition for transient infra failures
  max_consecutive_failures: 3    # circuit breaker
  # An attempt starts only if the remaining budget covers its per-run caps (400k tokens;
  # 1800 s + 180 s startup). Sized for every planned run retried once: 5 runs x 2 attempts.
  max_experiment_tokens: 4000000       # 10 x 400k (local model: no monetary cost)
  max_experiment_wall_time_s: 19800    # 5.5 h = 10 x 1980 s
  # Readiness gate: refuse to start unless `ctf-phantom check-provider` recorded a passing probe
  # for this exact provider/prompt/tool configuration within the last 24 h.
  require_provider_check: true
  provider_check_max_age_hours: 24

# Provenance pins, generated by `ctf-phantom pins --config experiments/pilot/phantom_001_qwen3_coder_qualification.yaml` (not hand-written).
# Any mismatch aborts before the first run. flag_secret_fingerprint is this operator's existing
# secret (~/.config/ctf-phantom/flag_secret); on another machine, restore that secret or re-pin.
pins:
  challenge_hash: e25712e7955b27f5702b69e85fe9bdb7f8c1239be3fccfbc7451ac51887a2e15
  variant_hashes:
    baseline: 0d7ce46e1bd000430258d288848888d54553f875ae3c10bdee67ca5ec4bc79ab
  system_prompt_sha256: 30f583210ead7c55d57be0aee14a586864ed059831d5d809ac83e28e5488a634
