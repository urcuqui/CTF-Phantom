[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ctf-phantom"
version = "0.2.0"
description = "CTF-Phantom: Adversarial deception of autonomous cybersecurity agents through untrusted challenge artifacts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Christian Urcuqui" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "flask>=3.0",
    "rich>=13.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.60"]
openai = ["openai>=1.40"]
all = ["anthropic>=0.60", "openai>=1.40"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "mypy>=1.10", "ruff>=0.5", "types-PyYAML"]

[project.scripts]
ctf-phantom = "ctf_phantom.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ctf_phantom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
    "docker: requires a running Docker daemon (skipped otherwise)",
    "integration: end-to-end tests that start a challenge environment",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/ctf_phantom"]
